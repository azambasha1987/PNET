name: PNetLab CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Code & Script Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Shell Script Syntax
        run: |
          echo "Validating bash syntax across all .sh scripts..."
          find . -name "*.sh" -not -path "*/.*/*" -print0 | xargs -0 -n 1 bash -n
          echo "All shell scripts passed bash -n syntax check."

      - name: Validate Python Syntax
        run: |
          echo "Validating compilation of all .py scripts..."
          find . -name "*.py" -not -path "*/.*/*" -print0 | xargs -0 -n 1 python -m py_compile
          echo "All Python scripts compiled cleanly."

      - name: Validate JSON Manifests
        run: |
          echo "Validating JSON files with jq..."
          find . -name "*.json" -not -path "*/.*/*" -exec jq . {} + > /dev/null
          echo "All JSON files are well-formed."

  verify-packages:
    name: Release Package Integrity & SHA256 Checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Package Parity & Checksums
        run: |
          chmod +x install/verify-packages.sh
          bash install/verify-packages.sh

  canonical-architecture-gates:
    name: Pure PNetLab Architecture & Naming Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enforce Canonical Script Naming Gate
        run: |
          echo "Checking for legacy prefixes in Custom pillar scripts..."
          LEGACY_COUNT=$(find Custom-Features/scripts Custom-Customization/scripts Custom-Performance/scripts \
            -type f \( -name "*azam*" -o -name "*azambasha*" \) 2>/dev/null | wc -l)
          if [ "$LEGACY_COUNT" -ne 0 ]; then
            echo "FAILED: Found $LEGACY_COUNT legacy prefixed scripts in Custom pillars!"
            find Custom-Features/scripts Custom-Customization/scripts Custom-Performance/scripts \
              -type f \( -name "*azam*" -o -name "*azambasha*" \)
            exit 1
          fi
          echo "PASSED: Zero legacy prefixes found in Custom pillar scripts."

      - name: Run Architecture Gates (Gates 16, 17, 18)
        run: |
          python3 -m unittest tests/test_architecture_gates.py -v

  unit-tests:
    name: Automated Unit & Subsystem Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-syntax, canonical-architecture-gates]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run Unittest Discovery
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Pytest Discovery
        run: |
          pytest tests/ -v -k "not test_playwright and not test_interactive_console"
