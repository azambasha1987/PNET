[Unit]
# Defect #A (docs/pnetlab-pass2-gate-run-2026-08-24-late.md sec.6/10.4): L3
# admin iptables/ip6tables rules now persist via netfilter-persistent. Its
# boot-time restore MUST run and finish before this unit's ovfstartup.sh calls
# pnet-fwd-reconcile.sh --iptables, so the reconciler always has the final say
# over its own PNETLAB-FWD chain and jump. reconcile_iptables() unconditionally
# flushes PNETLAB-FWD and drains every existing FORWARD jump before reinserting
# exactly one (see engine-custom/opt/ovf/pnet-fwd-reconcile.sh), so this is
# safe by construction even if a restored snapshot still contains PNetLab's own
# stale chain/jump from before the last shutdown -- it gets discarded, not
# duplicated onto. Wrong ordering the other way (reconcile, then restore) would
# silently undo the reconciler's freshly-rebuilt chain until the next Docker
# restart or reboot, defeating the point of persisting admin rules at all.
#
# This is a drop-in, not an edit to the base unit: pnetlab-ovfstartup.service
# itself is generated at build time by debs/lib/stage-common.sh (a file another
# concurrent change owns), so ordering is added the same way 10-pnetlab-fwd.conf
# already orders the Docker ExecStartPost reconciliation, by dropping in onto
# the unit name rather than touching its generator.
After=netfilter-persistent.service
Wants=netfilter-persistent.service
