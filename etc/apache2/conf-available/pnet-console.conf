# pnet-console.conf — WebSocket reverse-proxy for the three console backends.
# Drop into the existing PNETLab vhost (inside the <VirtualHost> that already
# serves the UI, so consoles are same-origin and share TLS + the session cookie).
#
# Enable once:
#   a2enmod proxy proxy_http proxy_wstunnel rewrite
#   systemctl reload apache2
#
# `upgrade=websocket` on ProxyPass needs Apache >= 2.4.47 (Jammy ships 2.4.52).

<IfModule mod_proxy_wstunnel.c>
    ProxyPreserveHost On

    # telnet/serial -> console_mux.py (telnetlib3 lane)  (xterm.js) [Slice 1]
    ProxyPass        /telnet/  ws://127.0.0.1:8022/  upgrade=websocket
    ProxyPassReverse /telnet/  ws://127.0.0.1:8022/

    # VNC -> console_mux.py (binary lane)  (noVNC)                   [Slice 2]
    ProxyPass        /vnc/     ws://127.0.0.1:6080/  upgrade=websocket
    ProxyPassReverse /vnc/     ws://127.0.0.1:6080/

    # RDP -> guacamole-lite -> guacd  (guacamole-common.js)         [Slice 3]
    ProxyPass        /guac/    ws://127.0.0.1:8081/  upgrade=websocket
    ProxyPassReverse /guac/    ws://127.0.0.1:8081/

    # authenticated host shell -> shell_ws_bridge.py (pty login)    [admin only]
    ProxyPass        /shell/   ws://127.0.0.1:8023/  upgrade=websocket
    ProxyPassReverse /shell/   ws://127.0.0.1:8023/

    # node http/https web console -> http_ws_bridge.py (iframe reverse-proxy).
    # http:// (not ws://) — the bridge proxies plain HTTP and upgrades to ws on
    # demand (upgrade=websocket lets the node app's own sockets tunnel through).
    # NOTE: :8025, NOT :8024 — :8024 is already the labstate push daemon.
    ProxyPass        /console/http/  http://127.0.0.1:8025/  upgrade=websocket
    ProxyPassReverse /console/http/  http://127.0.0.1:8025/
</IfModule>

# CSP override for the proxied node web app. The engine's web-hardening pass
# (pnet-hardening.conf, server scope) sets a strict global CSP
# (default-src 'self'; script-src 'self'; ...) + X-Frame-Options SAMEORIGIN.
# That policy is correct for the PNetLab UI but would break the PROXIED node app,
# which serves its OWN inline scripts/styles/assets under this path. A <Location>
# is more specific than server scope, so these header ops win: strip the engine
# CSP/XFO for this path and set only frame-ancestors 'self' — the node console
# stays same-origin-framable (our iframe) with no script/style/img restrictions.
# Needs mod_headers (already enabled by enable-web-hardening.sh).
<Location "/console/http/">
    Header always unset Content-Security-Policy
    Header always unset Content-Security-Policy-Report-Only
    Header always unset X-Frame-Options
    Header always set Content-Security-Policy "frame-ancestors 'self'"
</Location>

# --- Fallback for Apache < 2.4.47 (no upgrade= param) ----------------------
